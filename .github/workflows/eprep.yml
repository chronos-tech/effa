name: Eprep Cron Maintenance

on:
  workflow_dispatch:
  repository_dispatch:
    types: [eprep_cron]

concurrency:
  group: update-resolution-urls
  cancel-in-progress: false

jobs:
  maintenance:
    name: Run Periodic Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir psycopg2-binary

      - name: Execute Maintenance Script
        env:
          EPREP_DATABASE_URL: ${{ secrets.EPREP_DATABASE_URL }}
          EPREP_PAYMENT_GATEWAY_URL: ${{ vars.EPREP_PAYMENT_GATEWAY_URL }}
          EPREP_PAYMENT_GATEWAY_API_KEY: ${{ secrets.EPREP_PAYMENT_GATEWAY_API_KEY }}
          EPREP_DISCORD_WEBHOOK_URL: ${{ secrets.EPREP_DISCORD_WEBHOOK_URL }}
          EPREP_RATE_TOPUP: ${{ vars.EPREP_RATE_TOPUP }}
        run: |
          python -u eprep_script.py
