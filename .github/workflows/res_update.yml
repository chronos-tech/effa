name: Update Resolution URLs

on:
  schedule:
    - cron: "0 */5 * * *"  # every 5 hours
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
        run: python -u anonRefresh.py

      - name: Update lastupdated.txt (daily only)
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          if [ -f lastupdated.txt ]; then
            LAST=$(cat lastupdated.txt)
          else
            LAST=""
          fi

          if [ "$TODAY" != "$LAST" ]; then
            echo "$TODAY" > lastupdated.txt
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Stage both tracking files
          git add lastupdated.txt fetch_cache.json || true
          
          # ตรวจสอบว่ามีการแก้ไขไฟล์หรือไม่
          if git diff --cached --quiet; then
            echo "No updates needed to cache or timestamp."
          else
            git commit -m "chore: update cache and daily timestamp $(date -u +"%Y-%m-%d")"
            git push
          fi
