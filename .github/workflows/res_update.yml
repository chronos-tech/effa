name: Update Resolution URLs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# ป้องกัน workflow สองรอบชนกันแล้ว push พร้อมกัน
concurrency:
  group: update-resolution-urls
  cancel-in-progress: false

jobs:
  update:
    name: Run Task 0 → Task 001 → Task 002
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # =========================
      # Task 0
      # =========================
      - name: Run Task 0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.ENV_OHOST }}
          ENV_OAPIKEY: ${{ secrets.ENV_OAPIKEY }}
          ENV_OREFERER: ${{ secrets.ENV_OREFERER }}
        run: |
          python -u anonRefresh.py --task0

      # =========================
      # Update lastupdated.txt
      # =========================
      - name: Update lastupdated.txt
        run: |
          TODAY=$(TZ=Asia/Bangkok date +"%Y-%m-%d")

          if [ -f lastupdated.txt ]; then
            LAST=$(cat lastupdated.txt)
          else
            LAST=""
          fi

          if [ "$TODAY" != "$LAST" ]; then
            echo "$TODAY" > lastupdated.txt
          fi

      # =========================
      # Task 001
      # =========================
      - name: Run Task 001
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.ENV_OHOST }}
          ENV_OAPIKEY: ${{ secrets.ENV_OAPIKEY }}
          ENV_OREFERER: ${{ secrets.ENV_OREFERER }}
        run: |
          python -u anonRefresh.py --task001

      # =========================
      # Task 002
      # =========================
      - name: Run Task 002
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.ENV_OHOST }}
          ENV_OAPIKEY: ${{ secrets.ENV_OAPIKEY }}
          ENV_OREFERER: ${{ secrets.ENV_OREFERER }}
        run: |
          python -u anonRefresh.py --task002

      # =========================
      # Commit & Push once
      # =========================
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add fetch_cache.json lastupdated.txt

          if git diff --cached --quiet; then
            echo "No updates needed."
          else
            git commit -m "chore: update cache $(date -u +"%Y-%m-%d %H:%M")"

            # Sync with remote before pushing in case main changed
            git pull --rebase origin main

            git push origin main
          fi
