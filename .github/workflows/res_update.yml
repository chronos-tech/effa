name: Update Resolution URLs

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-resolution-urls
  cancel-in-progress: false

jobs:
  task0:
    name: Task 0 - Resolution Refresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Task 0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.OHOST }}
          ENV_OAPIKEY: ${{ secrets.OAPIKEY }}
          ENV_OREFERER: ${{ secrets.OREFERER }}
        run: python -u anonRefresh.py --task0

      - name: Update lastupdated.txt
        run: |
          TODAY=$(TZ=Asia/Bangkok date +"%Y-%m-%d")

          if [ -f lastupdated.txt ]; then
            LAST=$(cat lastupdated.txt)
          else
            LAST=""
          fi

          if [ "$TODAY" != "$LAST" ]; then
            echo "$TODAY" > lastupdated.txt
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add lastupdated.txt fetch_cache.json

          if git diff --cached --quiet; then
            echo "No updates needed."
          else
            git commit -m "chore: task0 refresh $(date -u +"%Y-%m-%d %H:%M")"
            git push origin main
          fi


  task001:
    name: Task 001 - Website Fetch
    runs-on: ubuntu-latest
    needs: task0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Task 001
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.OHOST }}
          ENV_OAPIKEY: ${{ secrets.OAPIKEY }}
          ENV_OREFERER: ${{ secrets.OREFERER }}
        run: python -u anonRefresh.py --task001

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add fetch_cache.json

          if git diff --cached --quiet; then
            echo "No cache updates."
          else
            git commit -m "chore: task001 update cache $(date -u +"%Y-%m-%d %H:%M")"
            git push origin main
          fi


  task002:
    name: Task 002 - Collection Tracking
    runs-on: ubuntu-latest
    needs: task001

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Task 002
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_URL2: ${{ secrets.API_BASE_URL2 }}
          THOST: ${{ secrets.THOST }}
          TPATH: ${{ secrets.TPATH }}
          NTFY_TTOPIC: ${{ secrets.NTFY_TTOPIC }}
          ENV_OHOST: ${{ secrets.OHOST }}
          ENV_OAPIKEY: ${{ secrets.OAPIKEY }}
          ENV_OREFERER: ${{ secrets.OREFERER }}
        run: python -u anonRefresh.py --task002

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add fetch_cache.json

          if git diff --cached --quiet; then
            echo "No cache updates."
          else
            git commit -m "chore: task002 update cache $(date -u +"%Y-%m-%d %H:%M")"
            git push origin main
          fi
