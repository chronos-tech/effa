
name: Camp Gallery Backup

on:
  repository_dispatch:
    types:
      - camp_cron

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camp-gallery-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Gallery to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_URL: ${{ secrets.API_URL_CAMP }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CAMP }}
      NTFY_URL: ${{ secrets.NTFY_URL_CAMP }}
      GALLERY_COOKIE: ${{ secrets.GALLERY_COOKIE_CAMP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gallery backup
        run: python camp.py

      - name: Commit cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cache.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update gallery backup cache"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Cache unchanged."
          fi
